# Every night (and by hand from the Actions tab): makes the lighter copies of
# any loop uploaded or replaced in Sanity since the last run
# (scripts/video-copies.mjs). Needs the repository secret
# SANITY_API_WRITE_TOKEN (an Editor token); without it the job just skips.
name: Video copies

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: video-copies
  cancel-in-progress: false

jobs:
  copies:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip without a token
        if: env.SANITY_API_WRITE_TOKEN == ''
        run: echo "No SANITY_API_WRITE_TOKEN secret yet, nothing to do."
      - name: Install ffmpeg (x264 + SVT-AV1)
        if: env.SANITY_API_WRITE_TOKEN != ''
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -hide_banner -encoders | grep -E "libx264|libsvtav1"
      - name: Make the copies
        if: env.SANITY_API_WRITE_TOKEN != ''
        run: node scripts/video-copies.mjs
